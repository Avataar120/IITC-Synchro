<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16c7d9"/>
      <stop offset="1" stop-color="#2451d6"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fff"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- téléphone -->
  <rect x="7" y="24" width="13" height="23" rx="2.5" fill="none" stroke="#fff" stroke-width="2.6"/>
  <line x1="11.5" y1="43" x2="15.5" y2="43" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- écran -->
  <rect x="36" y="23" width="22" height="16" rx="2" fill="none" stroke="#fff" stroke-width="2.6"/>
  <path d="M43 46 h8 M47 39 v7" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <!-- flèches de synchro -->
  <path d="M14 19 Q30 5 44 17" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" marker-end="url(#head)"/>
  <path d="M50 52 Q34 62 20 53" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" marker-end="url(#head)"/>
</svg>
