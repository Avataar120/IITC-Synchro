<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16c7d9"/>
      <stop offset="1" stop-color="#2451d6"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="16" height="16" rx="3" fill="url(#bg)" shape-rendering="geometricPrecision"/>
  <!-- téléphone -->
  <rect x="1" y="4" width="3" height="8" fill="#fff"/>
  <!-- écran -->
  <rect x="11" y="4" width="4" height="5" fill="#fff"/>
  <rect x="12" y="9" width="2" height="1" fill="#fff"/>
  <rect x="11" y="10" width="4" height="1" fill="#fff"/>
  <!-- flèche aller -->
  <rect x="5" y="5" width="2" height="1" fill="#fff"/>
  <rect x="7" y="3" width="1" height="5" fill="#fff"/>
  <rect x="8" y="4" width="1" height="3" fill="#fff"/>
  <rect x="9" y="5" width="1" height="1" fill="#fff"/>
  <!-- flèche retour -->
  <rect x="9" y="10" width="1" height="1" fill="#fff"/>
  <rect x="8" y="8" width="1" height="5" fill="#fff"/>
  <rect x="7" y="9" width="1" height="3" fill="#fff"/>
  <rect x="6" y="10" width="1" height="1" fill="#fff"/>
</svg>
